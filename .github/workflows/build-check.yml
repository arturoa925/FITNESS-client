name: build check

on:
  push:
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (fails on errors; warnings are tracked but allowed)
        run: npm run lint
      - name: Unit tests (auth/session + Face ID logic)
        run: npm test
      # Compiles every screen and import into a real iOS (Hermes) bundle. Catches broken
      # imports, syntax errors and missing dependencies without needing a simulator.
      - name: Compile iOS bundle
        run: npx expo export --platform ios --output-dir dist
      - name: Dependency audit (never blocks; Expo tooling advisories are known)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
